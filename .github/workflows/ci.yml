name: PHANTOM CI

on:
  push:
    branches: [phantom-v2]
  pull_request:
    branches: [phantom-v2]

permissions:
  contents: read

concurrency:
  group: phantom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/alembic backend/tests
      - name: Validate Alembic revisions
        run: |
          cd backend
          alembic history
          alembic heads
      - name: Run backend unit tests
        run: |
          cd backend
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
