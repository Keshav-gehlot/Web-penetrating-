name: PHANTOM CI

on:
  push:
    branches: [phantom-v2]
  pull_request:
    branches: [phantom-v2]

permissions:
  contents: read

concurrency:
  group: phantom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://phantom:phantom@127.0.0.1:5432/phantom_ci
      PHANTOM_AUTH_SECRET: ci-only-auth-secret
      PHANTOM_BOOTSTRAP_PASSWORD: ci-only-bootstrap-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phantom
          POSTGRES_PASSWORD: phantom
          POSTGRES_DB: phantom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phantom -d phantom_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/alembic backend/tests
      - name: Validate Alembic revisions
        run: |
          cd backend
          alembic history
          alembic heads
      - name: Validate Alembic migration plan
        run: |
          cd backend
          alembic history --verbose
          alembic heads
          test "$(alembic heads | grep -c '^0012_asset_services_history')" -eq 1
      - name: Migration upgrade / downgrade / re-upgrade
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          test "$(alembic current | grep -c '0011_asset_inventory')" -eq 1
          alembic upgrade head
      - name: Run backend unit tests
        run: |
          cd backend
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript type check
        run: npm run lint -- --pretty false
      - run: npm run build
