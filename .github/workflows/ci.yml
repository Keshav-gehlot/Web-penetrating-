name: PHANTOM CI

on:
  push:
    branches: [phantom-v2]
  pull_request:
    branches: [phantom-v2]

permissions:
  contents: read

concurrency:
  group: phantom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/alembic backend/tests
      - name: Validate Alembic revisions
        run: |
          cd backend
          alembic history
          alembic heads
      - name: Render Alembic migration plan
        env:
          DATABASE_URL: sqlite+aiosqlite:///./phantom-plan.db
          PHANTOM_AUTH_SECRET: ci-only-auth-secret
          PHANTOM_BOOTSTRAP_PASSWORD: ci-only-bootstrap-password
        run: |
          cd backend
          alembic upgrade head --sql > /tmp/phantom-schema.sql
          grep -q "workspace_scopes" /tmp/phantom-schema.sql
          grep -q "asset_services" /tmp/phantom-schema.sql
          grep -q "asset_history" /tmp/phantom-schema.sql
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite+aiosqlite:///./phantom-ci.db
          PHANTOM_AUTH_SECRET: ci-only-auth-secret
          PHANTOM_BOOTSTRAP_PASSWORD: ci-only-bootstrap-password
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade 0011_asset_inventory
          alembic upgrade head
          test -f phantom-ci.db
      - name: Run backend unit tests
        run: |
          cd backend
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
